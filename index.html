<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Shop Tracker (Standalone)</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6b6a65;--line:#e4e2da;--acc:#0f6e56;--acc2:#e8f3ef;--bad:#b3261e;--good:#0f6e56;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--ink:#f1efe8;--mute:#a09e96;--line:#363633;--acc:#4cc9a3;--acc2:#1d2e29;--bad:#f2b8b5;--good:#4cc9a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--ink:#f1efe8;--mute:#a09e96;--line:#363633;--acc:#4cc9a3;--acc2:#1d2e29;--bad:#f2b8b5;--good:#4cc9a3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
button{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:8px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#0b1f19}}
button.sm{padding:5px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:none}.tabs button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mute)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600}td.n,th.n{text-align:right}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.mute{color:var(--mute);font-size:13px}.err{color:var(--bad);font-size:13px;min-height:18px}
.login{max-width:380px;margin:8vh auto 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tot{font-size:22px;font-weight:700;margin:8px 0}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">Loading…</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso=n=>"₱"+(Number(n)||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let db=null,cfg=undefined,services=[],sales=[],sess=null,tab="dash",period="today",sel=null,err="",loadFail=false;
try{sess=JSON.parse(sessionStorage.getItem("ps_sess")||"null")}catch(e){}
const save=()=>{try{sessionStorage.setItem("ps_sess",JSON.stringify(sess))}catch(e){}};

const KEY="ps_data_v1";
let store;try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){store={}}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){alert("This browser can't save data. Try Chrome or Edge, and don't use private/incognito mode.")}};
const subs=[];const notify=()=>subs.forEach(f=>f());
const mkq=(c,ord)=>({
  orderBy(f,d){return mkq(c,[f,d])},limit(){return this},
  onSnapshot(next){const f=()=>{const a=Object.entries(store[c]||{}).map(([id,d])=>({id,data:()=>d}));
    if(ord){const k=ord[0],m=ord[1]==="desc"?-1:1;a.sort((x,y)=>((x.data()[k]||0)-(y.data()[k]||0))*m)}next({docs:a})};subs.push(f);f()}
});
function makeDb(){return{
  doc(p){const [c,id]=p.split("/");return{
    set:async d=>{(store[c]=store[c]||{})[id]=d;persist();notify()},
    update:async d=>{if(store[c]&&store[c][id]){Object.assign(store[c][id],d);persist();notify()}},
    delete:async()=>{if(store[c]){delete store[c][id];persist();notify()}},
    onSnapshot(next){const f=()=>{const d=(store[c]||{})[id];next({id,exists:!!d,data:()=>d})};subs.push(f);f()}}},
  collection(c){const q=mkq(c);q.add=async d=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);(store[c]=store[c]||{})[id]=d;persist();notify()};return q}
}}
function saveFile(name,data,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function init(){
  db=makeDb();
  db.doc("settings/config").onSnapshot(s=>{cfg=s.exists?s.data():null;render()});
  db.collection("services").onSnapshot(s=>{services=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));render()});
  db.collection("sales").orderBy("ts","desc").limit(1000).onSnapshot(s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));render()});
}

function render(){
  const a=$("#app");
  if(!db)return;
  if(cfg===undefined){a.innerHTML=loadFail?'<p class="err">Can’t reach the data yet. Check your connection.</p>':'<p class="mute">Loading…</p>';return}
  if(cfg===null)return setup(a);
  if(!sess)return login(a);
  const keep=document.activeElement&&document.activeElement.id;
  if(sess.role==="admin")admin(a);else staff(a);
}

function setup(a){
  a.innerHTML=`<div class="card login"><h1>Set up your shop</h1><p class="mute">Choose two easy-to-remember codes. You can change them later.</p>
  <label>Shop name</label><input id="sn" placeholder="e.g. Quick Print">
  <label>Admin code (owner only)</label><input id="ap" placeholder="e.g. 2468">
  <label>Staff code (shared by in-charge)</label><input id="sp" placeholder="e.g. 1234">
  <p class="err" id="e"></p><button class="p" id="go" style="width:100%">Save and start</button></div>`;
  $("#go").onclick=async()=>{const ap=$("#ap").value.trim(),sp=$("#sp").value.trim(),sn=$("#sn").value.trim()||"Print Shop";
    if(ap.length<3||sp.length<3||ap===sp){$("#e").textContent="Use two different codes, at least 3 characters each.";return}
    try{await db.doc("settings/config").set({shop:sn,adminPin:ap,staffPin:sp});
    const d=[["Photocopy (B&W)",2,0.6],["Printing (Colored)",10,3],["Lamination",25,10],["Scanning",10,1]];
    for(const x of d)await db.collection("services").add({name:x[0],price:x[1],cost:x[2],active:true});}catch(e){$("#e").textContent="Could not save. Ask the owner to give you edit access."}}
}

function login(a){
  a.innerHTML=`<div class="card login"><h1>${esc(cfg.shop)}</h1><p class="mute">Sign in to continue</p>
  <label>Your name</label><input id="nm" placeholder="e.g. Maria">
  <label>Code</label><input id="pw" type="password" inputmode="numeric" placeholder="Enter code">
  <p class="err" id="e"></p><button class="p" id="go" style="width:100%">Sign in</button>
  <p class="mute" style="margin-top:10px">Owner: use the admin code. In-charge: use the staff code.</p></div>`;
  const go=()=>{const nm=$("#nm").value.trim(),pw=$("#pw").value.trim();
    if(pw===cfg.adminPin){sess={role:"admin",name:nm||"Owner"}}
    else if(pw===cfg.staffPin){if(!nm){$("#e").textContent="Please type your name.";return}sess={role:"staff",name:nm}}
    else{$("#e").textContent="Wrong code. Try again.";return}
    save();render()};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

const head=()=>`<div class="top"><div><h1>${esc(cfg.shop)}</h1><span class="mute">${esc(sess.name)} · ${sess.role==="admin"?"Admin":"In-charge"}</span></div><button id="out">Log out</button></div>`;
const bindOut=()=>{$("#out").onclick=()=>{sess=null;try{sessionStorage.removeItem("ps_sess")}catch(e){}render()}};

function staff(a){
  const act=services.filter(s=>s.active!==false);
  if(!sel||!act.find(s=>s.id===sel))sel=act[0]?act[0].id:null;
  const s=act.find(x=>x.id===sel);
  const today=dayKey(Date.now()),mine=sales.filter(x=>x.day===today);
  const prev=a.querySelector("#qty")?a.querySelector("#qty").value:"1";
  a.innerHTML=head()+`<div class="card"><h2>Record a sale</h2>
  <div class="chips">${act.map(x=>`<button data-s="${esc(x.id)}" class="${x.id===sel?"on":""}">${esc(x.name)}</button>`).join("")||'<span class="mute">No services yet. Ask the admin to add one.</span>'}</div>
  ${s?`<div class="row"><div><label>Quantity / pieces</label><input id="qty" type="number" min="1" value="${esc(prev)}" inputmode="numeric"></div>
  <div><label>Amount paid (₱)</label><input id="paid" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
  <p class="mute">Standard price: ${peso(s.price)} each. Change the amount if the customer got a discount.</p>
  <p class="err" id="e"></p><button class="p" id="rec" style="width:100%">Save sale</button>`:""}</div>
  <div class="card"><h2>Today’s sales</h2><div class="tot">${peso(mine.reduce((t,x)=>t+x.paid,0))}</div>
  <div class="tw"><table><tr><th>Time</th><th>Service</th><th class="n">Qty</th><th class="n">Paid</th><th>By</th></tr>
  ${mine.map(x=>`<tr><td>${new Date(x.ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</td><td>${esc(x.name)}</td><td class="n">${x.qty}</td><td class="n">${peso(x.paid)}</td><td>${esc(x.staff)}</td></tr>`).join("")||'<tr><td colspan="5" class="mute">Nothing recorded yet today.</td></tr>'}</table></div></div>`;
  bindOut();
  a.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel=b.dataset.s;render()});
  if(s){const q=$("#qty"),p=$("#paid");const upd=()=>{p.value=((+q.value||0)*s.price).toFixed(2)};upd();q.oninput=upd;
    $("#rec").onclick=async()=>{const qty=Math.floor(+q.value),paid=+p.value;
      if(!(qty>=1)||!(paid>=0)||p.value===""){$("#e").textContent="Enter a valid quantity and amount.";return}
      $("#rec").disabled=true;
      try{await db.collection("sales").add({sid:s.id,name:s.name,qty,paid,cost:+s.cost||0,staff:sess.name,ts:Date.now(),day:dayKey(Date.now())})}catch(e){$("#e").textContent="Could not save. Please try again.";$("#rec").disabled=false}}}
}

function inPeriod(x){
  const now=new Date(),t=x.ts;
  if(period==="all")return true;
  if(period==="today")return x.day===dayKey(now);
  if(period==="week")return t>=Date.now()-7*864e5;
  if(period==="month")return new Date(t).getMonth()===now.getMonth()&&new Date(t).getFullYear()===now.getFullYear();
  return true;
}

function admin(a){
  const ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&a.contains(ae)&&ae.id!=="x"&&tab!=="dash"&&tab!=="sales")return;
  const tabs=[["dash","Dashboard"],["sales","Sales log"],["svc","Services"],["set","Settings"]];
  let body="";
  if(tab==="dash"||tab==="sales"){
    const list=sales.filter(inPeriod);
    const sum=(f)=>list.reduce((t,x)=>t+f(x),0);
    const rev=sum(x=>x.paid),cost=sum(x=>x.cost*x.qty);
    const per={};list.forEach(x=>{const k=x.sid;const r=per[k]||(per[k]={name:x.name,q:0,rev:0,cost:0,n:0});r.q+=x.qty;r.rev+=x.paid;r.cost+=x.cost*x.qty;r.n++});
    services.forEach(s=>{if(!per[s.id])per[s.id]={name:s.name,q:0,rev:0,cost:0,n:0}});
    const rows=Object.values(per).sort((p,q)=>(q.rev-q.cost)-(p.rev-p.cost));
    body=`<div class="chips" style="margin-bottom:10px">${[["today","Today"],["week","Last 7 days"],["month","This month"],["all","All time"]].map(p=>`<button data-p="${p[0]}" class="${period===p[0]?"on":""}">${p[1]}</button>`).join("")}</div><div class="row" style="margin-bottom:10px"><button class="sm" data-x="sales">⬇ Download sales (CSV)</button><button class="sm" data-x="sum">⬇ Download profit summary (CSV)</button></div><p class="err" id="xe"></p>`;
    if(tab==="dash")body+=`<div class="stats"><div class="stat"><span>Revenue</span><b>${peso(rev)}</b></div><div class="stat"><span>Cost</span><b>${peso(cost)}</b></div><div class="stat"><span>Profit</span><b class="${rev-cost>=0?"pos":"neg"}">${peso(rev-cost)}</b></div><div class="stat"><span>Services availed</span><b>${list.length}</b></div></div>
    <div class="card"><h2>Profit by service</h2><div class="tw"><table><tr><th>Service</th><th class="n">Times availed</th><th class="n">Pieces</th><th class="n">Paid</th><th class="n">Cost</th><th class="n">Profit</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${r.n}</td><td class="n">${r.q}</td><td class="n">${peso(r.rev)}</td><td class="n">${peso(r.cost)}</td><td class="n ${r.rev-r.cost>=0?"pos":"neg"}">${peso(r.rev-r.cost)}</td></tr>`).join("")||'<tr><td colspan="6" class="mute">No data yet.</td></tr>'}</table></div></div>`;
    else body+=`<div class="card"><h2>Sales log</h2><div class="tw"><table><tr><th>Date</th><th>Service</th><th class="n">Qty</th><th class="n">Paid</th><th class="n">Profit</th><th>By</th><th></th></tr>
    ${list.map(x=>`<tr><td>${new Date(x.ts).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(x.name)}</td><td class="n">${x.qty}</td><td class="n">${peso(x.paid)}</td><td class="n ${x.paid-x.cost*x.qty>=0?"pos":"neg"}">${peso(x.paid-x.cost*x.qty)}</td><td>${esc(x.staff)}</td><td><button class="sm" data-del="${esc(x.id)}">Delete</button></td></tr>`).join("")||'<tr><td colspan="7" class="mute">No sales in this period.</td></tr>'}</table></div></div>`;
  }
  if(tab==="svc")body=`<div class="card"><h2>Add a new service</h2><div class="row"><div><label>Service name</label><input id="nn" placeholder="e.g. Tarpaulin printing"></div><div><label>Selling price (each)</label><input id="np" type="number" step="0.01" inputmode="decimal"></div><div><label>Your cost (each)</label><input id="nc" type="number" step="0.01" inputmode="decimal"></div></div><p class="err" id="e"></p><button class="p" id="add">Add service</button><p class="mute">Cost = ink, paper, materials per piece. Profit = amount paid − cost × quantity.</p></div>
  <div class="card"><h2>Your services</h2><div class="tw"><table><tr><th>Name</th><th class="n">Price</th><th class="n">Cost</th><th></th></tr>
  ${services.map(s=>`<tr><td>${esc(s.name)}${s.active===false?' <span class="mute">(hidden)</span>':""}</td><td class="n">${peso(s.price)}</td><td class="n">${peso(s.cost)}</td><td><button class="sm" data-ed="${esc(s.id)}">Edit</button> <button class="sm" data-tg="${esc(s.id)}">${s.active===false?"Show":"Hide"}</button></td></tr>`).join("")}</table></div></div>`;
  if(tab==="set")body=`<div class="card"><h2>Shop settings</h2><label>Shop name</label><input id="sn" value="${esc(cfg.shop)}"><label>Admin code</label><input id="ap" value="${esc(cfg.adminPin)}"><label>Staff code</label><input id="sp" value="${esc(cfg.staffPin)}"><p class="err" id="e"></p><button class="p" id="sv">Save</button>
  <p class="mute">Staff sign in with their name and the staff code, and can only record sales. They never see profit.</p></div>
  <div class="card"><h2>Backup and restore</h2><p class="mute">Your records are saved only in this browser on this computer. Download a backup often and keep it somewhere safe (flash drive, email to yourself).</p>
  <div class="row"><button class="p" id="bk">Download full backup</button><button id="rs">Restore from backup</button></div><input type="file" id="rf" accept=".json" style="display:none"><p class="err" id="be"></p></div>`;
  a.innerHTML=head()+`<div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>`+body;
  bindOut();
  a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  a.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{period=b.dataset.p;render()});
  a.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>exportCsv(b.dataset.x));
  a.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Delete this sale record?"))db.doc("sales/"+b.dataset.del).delete()});
  a.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const s=services.find(x=>x.id===b.dataset.tg);db.doc("services/"+s.id).update({active:s.active===false})});
  a.querySelectorAll("[data-ed]").forEach(b=>b.onclick=async()=>{const s=services.find(x=>x.id===b.dataset.ed);
    const n=prompt("Service name",s.name);if(n===null)return;const p=prompt("Selling price (each)",s.price);if(p===null)return;const c=prompt("Your cost (each)",s.cost);if(c===null)return;
    if(n.trim()&&!isNaN(+p)&&!isNaN(+c))db.doc("services/"+s.id).update({name:n.trim(),price:+p,cost:+c})});
  if($("#add"))$("#add").onclick=async()=>{const n=$("#nn").value.trim(),p=+$("#np").value,c=+$("#nc").value||0;
    if(!n||!(p>=0)||$("#np").value===""){$("#e").textContent="Enter a name and a selling price.";return}
    try{await db.collection("services").add({name:n,price:p,cost:c,active:true})}catch(e){$("#e").textContent="Could not add service."}};
  if($("#bk"))$("#bk").onclick=()=>saveFile("print-shop-backup-"+dayKey(Date.now())+".json",JSON.stringify(store),"application/json");
  if($("#rs")){$("#rs").onclick=()=>$("#rf").click();$("#rf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.settings||!d.settings.config)throw 0;
    if(!confirm("Replace ALL current records with this backup?"))return;store=d;persist();location.reload()}catch(x){$("#be").textContent="That file is not a valid backup."}};r.readAsText(f)}}
  if($("#sv"))$("#sv").onclick=async()=>{const ap=$("#ap").value.trim(),sp=$("#sp").value.trim(),sn=$("#sn").value.trim()||"Print Shop";
    if(ap.length<3||sp.length<3||ap===sp){$("#e").textContent="Use two different codes, at least 3 characters.";return}
    try{await db.doc("settings/config").set({shop:sn,adminPin:ap,staffPin:sp});$("#e").textContent="Saved ✓"}catch(e){$("#e").textContent="Could not save."}};
}
const cell=v=>{let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
async function exportCsv(kind){
  const msg=t=>{const e=$("#xe");if(e)e.textContent=t};
  const dl={save:async({filename,data})=>saveFile(filename,data,"text/csv;charset=utf-8")};
  const list=sales.filter(inPeriod);let rows;
  if(kind==="sales"){
    rows=[["Date","Time","Service","Quantity","Amount paid","Unit cost","Total cost","Profit","Recorded by"]];
    list.slice().reverse().forEach(x=>{const d=new Date(x.ts);rows.push([x.day,d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}),x.name,x.qty,x.paid.toFixed(2),(+x.cost).toFixed(2),(x.cost*x.qty).toFixed(2),(x.paid-x.cost*x.qty).toFixed(2),x.staff])});
  }else{
    const per={};list.forEach(x=>{const r=per[x.sid]||(per[x.sid]={name:x.name,n:0,q:0,rev:0,cost:0});r.n++;r.q+=x.qty;r.rev+=x.paid;r.cost+=x.cost*x.qty});
    rows=[["Service","Times availed","Pieces","Amount paid","Total cost","Profit"]];
    Object.values(per).forEach(r=>rows.push([r.name,r.n,r.q,r.rev.toFixed(2),r.cost.toFixed(2),(r.rev-r.cost).toFixed(2)]));
  }
  const csv="\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n");
  try{await dl.save({filename:"print-shop-"+kind+"-"+period+"-"+dayKey(Date.now())+".csv",data:csv});msg("")}
  catch(e){msg(e&&e.code==="declined"?"":"Could not save the file.")}
}
init();
</script>
</body>
</html>
